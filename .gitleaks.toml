title = "go-revolut-business secret scanning"

[extend]
useDefault = true

# gitleaks' `dir` mode walks the working tree and does NOT honour .gitignore, so
# every gitignored local path is named again here. Nothing gitignored is tracked
# by git. The committed Go vendor/ tree is intentionally NOT listed: it ships to
# consumers, so it gets scanned. Verify with `git check-ignore <path>` before
# adding a line; an entry for a committed source path silences real leaks.
[[allowlists]]
description = "Gitignored local scratch, downloaded specs, caches, and scan artifacts"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.vscode(?:/|$)''',
  '''(^|/)\.telemetry(?:/|$)''',
  '''(^|/)\.research_files(?:/|$)''',
  '''(^|/)\.testing(?:/|$)''',
  '''(^|/)api/business(?:\.patched)?\.yaml$''',
  '''(^|/)__pycache__(?:/|$)''',
  '''(^|/)sec\.sarif$''',
  '''(^|/)git-update\.sh(?:\.debot)?$''',
  '''(^|/)CLAUDE\.md$''',
]

# oapi-codegen copies schema examples into doc comments, and the WebhookV2
# example in Revolut's spec carries a sample signing secret. Only that exact
# published sample is allowed, and only in the generated client.
[[allowlists]]
description = "Sample webhook signing secret from Revolut's published spec"
condition = "AND"
paths = ['''(^|/)client\.gen\.go$''']
regexes = ['''wsk_4jETWMz1g1b37gCONjNp84t2KSSIT7dK''']
